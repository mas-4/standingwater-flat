<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script><sky-include path="theme.js" /></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><sky-slot name="title" />${meta.title}</title>
    <meta name="description" content="${meta.description}" />
    <meta name="theme-color" content="#142420" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Every page is a sheet of paper lying on the source it was built
         from. This checkbox lifts the sheet; no JavaScript involved. -->
    <input type="checkbox" id="xray" class="xray" aria-label="Show the source of this page" />
    <div class="desk">
      <div class="sheet">
        <!-- Under the paper, the page's source, for the candle to show. -->
        <div class="underside" aria-hidden="true"><sky-sources item="underside.html" /></div>
        <div class="paper" aria-hidden="true"></div>
        <label for="xray" class="sheet-cover" title="Back to the page"></label>
        <sky-include path="_nav.html" />
        <main class="page">
          <sky-slot name="content" />
        </main>
        <sky-include path="_footer.html" />
      </div>
      <aside class="ground" aria-label="The source of this page">
        <header class="ground-head">
          <p>
            <a href="https://github.com/mas-4/skyblue">skyblue</a> built this
            page from these files, in the order it used them.
          </p>
          <label for="xray" class="ground-close">back to the page →</label>
        </header>
        <sky-sources item="source.html" />
      </aside>
    </div>
    <script><sky-include path="candle.js" /></script>
  </body>
</html>
