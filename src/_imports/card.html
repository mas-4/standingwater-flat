<a class="card" href="${post.url}">
  <div class="card-image" data-label="${post.title}"><img src="${frontmatter.featureImage}" alt="" loading="lazy" /></div>
  <div class="card-body">
    <p class="pills"><span class="pill">${frontmatter.category}</span><span class="pill pill-ai">${frontmatter.ai}</span><span class="year">${frontmatter.year}</span></p>
    <h2>${post.title}</h2>
  </div>
</a>
