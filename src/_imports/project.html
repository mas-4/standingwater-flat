<sky-template path="main.html" />

<sky-block name="title">${frontmatter.title} · </sky-block>

<sky-block name="content">
  <article class="project">
    <a class="back" href="/projects">← all projects</a>
    <p class="pills"><span class="pill">${frontmatter.category}</span><span class="pill pill-ai">${frontmatter.ai}</span><span class="year">${frontmatter.year}</span></p>
    <h1>${frontmatter.title}</h1>
    <a class="visit" href="${frontmatter.url}">${frontmatter.url}</a>
    <img class="feature" src="${frontmatter.featureImage}" alt="" />
    <div class="markdown">
      <sky-slot name="content" />
    </div>
  </article>
</sky-block>
